# One-click hosting on Render (https://render.com/docs/blueprint-spec):
# the app as a Docker web service plus a managed Postgres database.
#
# Render → New → Blueprint → pick this repository and branch. You'll be asked for
# SMTP_USER, SMTP_PASS and EMAIL_FROM (see DEPLOY.md). The public URL is detected automatically.
#
# This starts with billing turned off, for testing. To charge customers later, remove
# BILLING_DISABLED and add STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_TEAM
# and STRIPE_PRICE_UNLIMITED in the service's Environment settings.
services:
  - type: web
    name: doccompare
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doccompare-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BILLING_DISABLED
        value: 'true'
      # Email for sign-in links, confirmations and invitations: a Gmail address and its app password.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
databases:
  - name: doccompare-db
    plan: basic-256mb
    # No outside connections: only services in this Render account can reach the database.
    ipAllowList: []
