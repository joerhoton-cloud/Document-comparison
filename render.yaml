# One-click managed hosting on Render (https://render.com/docs/blueprint-spec):
# a Docker web service plus a managed Postgres database. Secrets marked sync:false
# are entered in the Render dashboard.
services:
  - type: web
    name: doccompare
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doccompare-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
databases:
  - name: doccompare-db
    plan: basic-256mb
    postgresMajorVersion: '16'
