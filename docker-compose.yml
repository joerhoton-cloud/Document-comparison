# Local or self-hosted setup: app + Postgres. Copy .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doccompare
      POSTGRES_USER: doccompare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doccompare']
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://doccompare:${POSTGRES_PASSWORD}@db:5432/doccompare
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
