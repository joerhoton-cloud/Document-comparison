server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # The app never uploads anything: refuse request bodies and non-read methods.
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Do not log query strings or referrers (there are none by design, but be safe).
    access_log /dev/stdout combined;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Fingerprinted build output: cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ES module workers need a JavaScript MIME type; older mime.types lack .mjs.
    location ~* \.mjs$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    location /pdfjs/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
